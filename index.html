:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h2,
h3,
h4,
h5,
h6,
p {

}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

      const flowThree = root.querySelector(&#x27;#ccg-flow-three&#x27;);

      let chosen = {};

      function selectedCount() {

      }

      function updateFlow(step) {
        [flowOne, flowTwo, flowThree, flowFour].forEach((item) =&gt; item.classList.remove(&#x27;is-active&#x27;));
        if (step === 1) {
          flowOne.classList.add(&#x27;is-active&#x27;);
          mode.textContent = &#x27;1단계 · 하루 선택&#x27;;

          mode.textContent = &#x27;2단계 · 탄소발자국 측정&#x27;;

      function summarizeChoices() {
        return blocks.map((block) =&gt; {
          const item = getChoice(block.dataset.block);
          return item ? item.dataset.label : &#x27;&#x27;;
        }).filter(Boolean);
      }

      function updateDayScores() {
        const dayBlocks = {
          morning: [&#x27;morning-move&#x27;, &#x27;morning-energy&#x27;],
          lunch: [&#x27;lunch-meal&#x27;, &#x27;lunch-waste&#x27;],
          evening: [&#x27;evening-return&#x27;, &#x27;evening-power&#x27;]

        Object.keys(dayBlocks).forEach((day) =&gt; {
          const dayTotal = dayBlocks[day].reduce((sum, key) =&gt; {
            const button = getChoice(key);

          dayScoreEls[day].textContent = dayTotal + &#x27;/4&#x27;;
        });
      }

      function renderSolarPhotons() {
        solarPhotons.innerHTML = &#x27;&#x27;;
        const ids = [&#x27;ccg-solar-path-1&#x27;, &#x27;ccg-solar-path-2&#x27;, &#x27;ccg-solar-path-3&#x27;, &#x27;ccg-solar-path-4&#x27;, &#x27;ccg-solar-path-5&#x27;];
        ids.forEach((pathId, index) =&gt; {
          const circle = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
          circle.setAttribute(&#x27;class&#x27;, &#x27;solar-photon&#x27;);
          circle.setAttribute(&#x27;r&#x27;, index % 2 === 0 ? &#x27;5&#x27; : &#x27;4&#x27;);
          const animate = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;animateMotion&#x27;);
          animate.setAttribute(&#x27;dur&#x27;, (3.1 + index * .35) + &#x27;s&#x27;);
          animate.setAttribute(&#x27;begin&#x27;, (-index * .6) + &#x27;s&#x27;);
          animate.setAttribute(&#x27;repeatCount&#x27;, &#x27;indefinite&#x27;);
          animate.setAttribute(&#x27;rotate&#x27;, &#x27;auto&#x27;);
          const mpath = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;mpath&#x27;);

      function renderParticles(score) {
        particles.innerHTML = &#x27;&#x27;;
        const total = 4 + score * 2;
        const positions = [
          [95, 185], [145, 205], [195, 185], [245, 215], [295, 190], [345, 225],
          [395, 185], [445, 215], [495, 190], [545, 225], [595, 185], [645, 210],
          [120, 235], [170, 220], [220, 240], [270, 230], [320, 245], [370, 220],

      function renderHeatPaths(score) {

          &#x27;M330 370 C315 321 332 279 346 231&#x27;,
          &#x27;M399 370 C416 321 402 278 420 232&#x27;,
          &#x27;M470 370 C492 326 481 284 493 239&#x27;

        const bouncePaths = [
          &#x27;M276 238 C271 274 286 319 303 370&#x27;,
          &#x27;M346 231 C340 275 359 320 374 370&#x27;,
          &#x27;M420 232 C416 274 432 318 447 370&#x27;,
          &#x27;M493 239 C486 276 502 322 520 370&#x27;
        ];
        const escapePaths = [
          &#x27;M260 370 C246 328 251 287 276 238 C288 210 292 178 304 142&#x27;,
          &#x27;M399 370 C416 321 402 278 420 232 C431 198 438 164 448 127&#x27;

        upPaths.forEach((d, index) =&gt; {
          const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);

      function addMovingPhoton(path, duration, begin, bounce) {
        const circle = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
        circle.setAttribute(&#x27;class&#x27;, &#x27;heat-photon&#x27;);

        animate.setAttribute(&#x27;dur&#x27;, duration + &#x27;s&#x27;);
        animate.setAttribute(&#x27;begin&#x27;, begin + &#x27;s&#x27;);

        animate.appendChild(mpath);
        circle.appendChild(animate);
        heatPhotons.appendChild(circle);

      function updateSimulation(score) {
        const layerPercent = Math.round(18 + score / 12 * 82);
        const layerHeight = 82 + score * 7;
        const layerY = 249 - layerHeight;

      function setSeaLevelVisual(score) {

          seaLine.style.transition = &#x27;&#x27;;
          seaWave.style.transition = &#x27;&#x27;;
          setSeaLevelVisual(score);
          seaAnimationTimer = null;
        }, 90);

      choices.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          chosen[button.dataset.key] = button.dataset.label;

      confirmButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        carbon = Object.keys(chosen).reduce((sum, key) =&gt; {
          const button = getChoice(key);
          return sum + Number(button ? button.dataset.score : 0);

        scoreEl.textContent = String(carbon);
        scoreFill.style.width = Math.round(carbon / 12 * 100) + &#x27;%&#x27;;
        updateDayScores();
        const labels = summarizeChoices();
        resultMessage.textContent = &#x27;오늘은 &#x27; + labels.slice(0, 3).join(&#x27;, &#x27;) + &#x27; 등의 선택으로 &#x27; + carbon + &#x27;/12 만큼 표시됐어요. 이제 공기층 속 열의 움직임을 관찰해 보세요.&#x27;;

        if (!simulation.hidden) {
          updateSimulation(carbon);
          updateFlow(3);

      seaReplay.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!seaLevel.hidden) updateSeaLevel(carbon, true);
      });
      updateSelection();
      renderSolarPhotons();
    })();
